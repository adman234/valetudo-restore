name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q app
      - name: Import and boot the app
        run: |
          export VR_CONFIG_DIR=./_c VR_BACKUP_DIR=./_b
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              assert c.get("/healthz").json()["ok"] is True
              assert c.get("/").status_code == 200
              assert c.get("/settings").status_code == 200
              assert c.get("/api/status").status_code == 200
          print("smoke tests passed")
          PY
      - name: Env seeding works
        run: |
          export VR_CONFIG_DIR=./_c2 VR_BACKUP_DIR=./_b2
          export VR_ROBOT_HOST=10.1.2.3 VR_KEEP_BACKUPS=7 VR_AUTO_RESTORE=true
          python - <<'PY'
          from app.models import load_settings
          s = load_settings()
          assert s.robot_host == "10.1.2.3", s.robot_host
          assert s.keep_backups == 7, s.keep_backups
          assert s.auto_restore is True
          print("env seeding OK")
          PY
